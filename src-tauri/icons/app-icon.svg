<!--
  Ícone do app (fonte). Os PNG/ICO desta pasta saem dele:
    bun run tauri icon src-tauri/icons/app-icon.svg -o <pasta temporária>
  e copiar só os cinco que o tauri.conf.json lista (32x32.png, 128x128.png,
  128x128@2x.png, icon.png, icon.ico).

  O desenho das pessoas é o ícone "users" da Lucide (https://lucide.dev),
  licença ISC — Copyright (c) for portions of Lucide are held by Cole Bemis
  2013-2022 as part of Feather (MIT). All other copyright (c) for Lucide are
  held by Lucide Contributors 2022. Mesma biblioteca que a interface já usa.

  O desenho é deslocado 0,5 unidade para a direita: a pessoa da esquerda é
  maior, e centralizado pela caixa ele pendia para a esquerda.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#g)"/>
  <g transform="translate(253.25,242) scale(22.5)" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
    <path d="M16 3.128a4 4 0 0 1 0 7.744"/>
    <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
    <circle cx="9" cy="7" r="4"/>
  </g>
</svg>
