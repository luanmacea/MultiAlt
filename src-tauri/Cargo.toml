[package]
name = "roblox-account-manager"
version = "1.0.0"
edition = "2021"

[lib]
name = "roblox_account_manager_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# As duas edições publicadas (ver docs/development.md, "As duas edições"):
# - padrão (`MultiAlt-Setup.msi`): `--no-default-features --features avatar-batch`;
# - completa (`MultiAlt_<v>_Full-Setup.msi`): `--features full`.
# `full` liga TODA feature opcional. Feature nova que fica fora da padrão (Nexus,
# Web API, live-audio quando chegar à develop, ou o que mais for segurado por
# marcação de scanner) TEM que entrar na lista do `full`: o workflow compila a
# completa só com `--features full`, sem lista própria, e o
# release-workflow.test.mjs falha se alguma feature ficar de fora.
default = ["full"]
full = ["nexus", "webserver", "avatar-batch"]
# Só na edição completa.
nexus = []
# Só na edição completa.
webserver = ["dep:axum"]
# Distribuir avatares salvos entre várias contas (resgate dos itens gratuitos
# + vestir). Nas duas edições desde 08/10/2026: a padrão o liga à parte.
avatar-batch = []

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["cookies", "json"] }
tokio = { version = "1", features = ["full"] }
urlencoding = "2"
cookie = "0.18"
semver = "1"
axum = { version = "0.8", optional = true }
tokio-tungstenite = { version = "0.26" }
futures-util = { version = "0.3" }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
zip = "0.6.6"
md-5 = "0.10"
sha2 = "0.10"
argon2 = "0.6.0"
crypto_secretbox = "0.1.1"
getrandom = "0.4.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    # Copiar credencial fora do histórico do Win+V e apagá-la depois de 30 s
    # (platform/windows/clipboard.rs). Só escrita: nada lê a área de transferência.
    "Win32_System_DataExchange",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Memory",
    # SetThreadExecutionState: PC acordado (sem a tela) durante o Modo AFK, o
    # Auto Rejoin e a reconexão automática (platform/windows/power.rs).
    "Win32_System_Power",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    # GetAsyncKeyState: Shift segurado no boot liga o safe mode do WebView2.
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
] }

[dev-dependencies]
# HTTP mocking for the Roblox API layer (see docs/development.md).
wiremock = "0.6"
# Drives axum routers in-process (web server middleware tests).
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# As DEPENDENCIAS saem otimizadas mesmo em debug; o nosso codigo nao (compila
# rapido e mantem bom debug). Isto existe pela criptografia: o Argon2 em Rust
# puro leva 5,4 s por derivacao sem otimizacao contra 0,3 s com ela (medido em
# 28/09/2026), e `cargo test` roda em debug — era o que fazia a suite Rust do CI
# levar 18 dos 24 minutos. O libsodium nao sofria disso por ser C pre-compilado.
[profile.dev.package."*"]
opt-level = 3

# Build de release otimizado para TAMANHO (medido em 10/10/2026, ver
# docs/development.md, "Perfil de release"): o exe padrao com tudo dos pacotes
# 1.3-1.6 saia 26,2 MB e 1/75 no VirusTotal (Trapmine, placar de ML no limite);
# com LTO + opt-level "s" + strip sai 16,2 MB e 0/71. So LTO + strip com
# opt-level 3 (22 MB) continuou marcado. A criptografia do vault fica na
# velocidade maxima (overrides abaixo): o Argon2 e o que a senha do app espera.
[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true

[profile.release.package.argon2]
opt-level = 3
[profile.release.package.blake2]
opt-level = 3
[profile.release.package.salsa20]
opt-level = 3
[profile.release.package.poly1305]
opt-level = 3
