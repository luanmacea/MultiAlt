name: Crowdin Sync

on:
  push:
    branches:
      - main
      - feat/translations-adding
    paths:
      - "src/locales/en/**"
      - "crowdin.yml"
  workflow_dispatch:
  schedule:
    - cron: "18 3 * * *"

# Mínimo de privilégio: nada escreve no repositório por padrão; só o job que
# abre o PR de traduções recebe escrita.
permissions:
  contents: read

# Sem os secrets do Crowdin (CROWDIN_PROJECT_ID e CROWDIN_PERSONAL_TOKEN) o
# workflow **pula** em vez de falhar: este repositório não tem projeto no
# Crowdin, e a action quebrava em todo push na main ("Required option
# 'api_token' is missing"). Configurar os dois secrets liga a sincronização.
#
# Os secrets entram **só** no passo que checa se existem (que não os imprime)
# e no passo da action do Crowdin — nunca no nível do job, onde vazariam para
# todos os passos, inclusive a action de terceiros que abre o PR.
jobs:
  upload-sources:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Crowdin configurado?
        id: crowdin
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: |
          if [ -n "$CROWDIN_PROJECT_ID" ] && [ -n "$CROWDIN_PERSONAL_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Crowdin não configurado (faltam os secrets CROWDIN_PROJECT_ID e CROWDIN_PERSONAL_TOKEN) — sincronização pulada."
          fi

      - name: Checkout
        if: steps.crowdin.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Upload source strings to Crowdin
        if: steps.crowdin.outputs.enabled == 'true'
        uses: crowdin/github-action@v2
        with:
          config: crowdin.yml
          upload_sources: true
          upload_translations: false
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

  download-translations:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # Só este job escreve: o PR de traduções precisa de branch e de PR.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Crowdin configurado?
        id: crowdin
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: |
          if [ -n "$CROWDIN_PROJECT_ID" ] && [ -n "$CROWDIN_PERSONAL_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Crowdin não configurado (faltam os secrets CROWDIN_PROJECT_ID e CROWDIN_PERSONAL_TOKEN) — sincronização pulada."
          fi

      - name: Checkout
        if: steps.crowdin.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Download translations from Crowdin
        if: steps.crowdin.outputs.enabled == 'true'
        uses: crowdin/github-action@v2
        with:
          config: crowdin.yml
          download_translations: true
          upload_sources: false
          upload_translations: false
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Create or update translation PR
        if: steps.crowdin.outputs.enabled == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(i18n): sync translations from Crowdin"
          title: "chore(i18n): sync translations from Crowdin"
          body: |
            Automated translation sync from Crowdin.
          branch: "chore/crowdin-translations"
          base: "develop"
