name: Site

# Publica a pasta `site/` (o site de divulgação, HTML estático) na branch
# `gh-pages`, de onde o GitHub Pages serve o site de graça em
# https://luanmacea.github.io/MultiAlt/.
#
# Roda a cada push em `main` que mexe no site — o site acompanha o que está
# publicado, não o trabalho em andamento na `develop` (desde 03/10/2026). Não
# espera release: mudança só em `site/` não dispara o release-v4.yml.
# A `gh-pages` é gerada: não edite nada nela à mão.
on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish site/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          commit_message: "Deploy site"
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"

  # Avisa Bing, Yandex e companhia (IndexNow) que as páginas do sitemap mudaram,
  # para elas entrarem no índice em horas em vez de semanas. A chave é o
  # arquivo site/<chave>.txt — não apague. O Cloudflare publica a `main` por
  # conta própria, então o passo espera a chave aparecer no ar antes de avisar.
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping IndexNow with every URL in the sitemap
        shell: bash
        run: |
          set -euo pipefail
          HOST="multialt.pages.dev"
          KEYFILE=$(ls site | grep -E '^[0-9a-f]{32}\.txt$' | head -n1)
          KEY="${KEYFILE%.txt}"
          for i in $(seq 1 30); do
            if [ "$(curl -fsS "https://$HOST/$KEYFILE" || true)" = "$KEY" ]; then break; fi
            sleep 20
          done
          URLS=$(grep -oE '<loc>[^<]+</loc>' site/sitemap.xml | sed -E 's#</?loc>##g' | jq -R . | jq -sc .)
          BODY=$(jq -nc --arg host "$HOST" --arg key "$KEY" --argjson urls "$URLS" \
            '{host: $host, key: $key, keyLocation: ("https://" + $host + "/" + $key + ".txt"), urlList: $urls}')
          curl -sS -o /dev/null -w "IndexNow: HTTP %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" -d "$BODY"
