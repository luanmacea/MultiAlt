name: CI

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "vite.config.ts"
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"
  push:
    branches:
      - main
      - develop
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "vite.config.ts"
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"

concurrency:
  # Um push novo na mesma branch (ou no mesmo PR) cancela o run anterior: o
  # resultado do commit que ja foi substituido nao interessa a ninguem.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Com um PR aberto da branch, o evento `pull_request` ja roda o CI **no mesmo
  # commit** que o `push` — eram dois runs de ~20 min para verificar a mesma
  # coisa. Este guard (segundos, no runner barato do Linux) decide se o run do
  # `push` e redundante. Medido em 28/09/2026: o commit `af99c73` teve os dois.
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        uses: actions/github-script@v7
        with:
          script: |
            // O evento do PR e sempre a fonte da verdade: ele e que aparece
            // como check no PR e libera o merge.
            if (context.eventName === 'pull_request') {
              core.setOutput('run', 'true');
              return;
            }
            const branch = context.ref.replace('refs/heads/', '');
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${branch}`,
            });
            if (prs.data.length > 0) {
              core.info(
                `PR aberto para ${branch} (#${prs.data[0].number}): o evento ` +
                  'pull_request ja verifica este commit, entao o run do push e pulado.'
              );
              core.setOutput('run', 'false');
              return;
            }
            core.setOutput('run', 'true');

  verify:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Mesmo motivo do release: sem cache, cada push recompila tudo do zero
      # para rodar `cargo test` e os dois `cargo check`.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # The same gate contributors run locally (bun run check), split into
      # steps so a failure points straight at the layer that broke.
      - name: Test suite audit (every test mapped in scripts/test-suites.ts)
        run: bun run test:audit

      - name: Frontend tests (vitest)
        run: bun run test

      - name: Backend tests (all features)
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --all-features

      - name: Build frontend (full)
        env:
          VITE_ENABLE_NEXUS: "true"
          VITE_ENABLE_WEBSERVER: "true"
        run: bun run build

      - name: Build frontend (standard)
        env:
          VITE_ENABLE_NEXUS: "false"
          VITE_ENABLE_WEBSERVER: "false"
        run: bun run build

      - name: Check Rust backend (full features)
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Check Rust backend (standard build)
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked --no-default-features
