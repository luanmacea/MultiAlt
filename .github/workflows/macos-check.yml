# Só na branch `macos` (04/11/2026): o backend compila e os testes passam no
# macOS? Daqui do Windows não dá para saber — dependências em C (ring,
# objc2-exception-helper) precisam do SDK da Apple. Não publica nada.
# Os erros vão para anotações do job, que a API pública do GitHub devolve sem
# token (o log não). Ver docs/features/macos.md.
name: macOS check

on:
  push:
    branches:
      - macos
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: "macos"

      - name: Check Rust backend (standard and full)
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo check --manifest-path src-tauri/Cargo.toml --locked --no-default-features --features standard --tests --message-format=short 2> standard.txt
          s=$?
          cargo check --manifest-path src-tauri/Cargo.toml --locked --all-features --tests --message-format=short 2> full.txt
          f=$?
          echo "$s" > standard.code; echo "$f" > full.code
          for edition in standard full; do
            code=$(cat $edition.code)
            n=$(grep -cE ': error|^error' $edition.txt)
            errors=$( { echo "total: $n"; grep -E ': error' $edition.txt | cut -d: -f1 | sort | uniq -c | sort -rn | head -40; echo; grep -E ': error|^error' $edition.txt | sort -u | head -25; } )
            [ "$n" -eq 0 ] && errors=$(tail -40 $edition.txt)
            body=$(printf '%s' "$errors" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            if [ "$code" -eq 0 ]; then echo "::notice title=$edition::compiles"; else echo "::error title=$edition (exit $code, $n errors)::$body"; fi
          done
          [ $s -eq 0 ] && [ $f -eq 0 ]

      - name: Run Rust tests (full)
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo test --manifest-path src-tauri/Cargo.toml --locked --all-features -- --test-threads=2 > tests.txt 2>&1
          code=$?
          failed=$(grep -E '^test .* FAILED$|^    [a-z_:]+$' tests.txt | sort -u | head -40)
          summary=$(grep -E '^test result' tests.txt | head -5)
          body=$(printf '%s\n%s' "$summary" "$failed" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          if [ "$code" -eq 0 ]; then echo "::notice title=tests::$body"; else echo "::error title=tests (exit $code)::$body"; fi
          exit $code
