# Build de TESTE dos instaladores Linux (AppImage, .deb e .rpm), uma edição cada
# (padrão e completa), para baixar da aba Actions e testar numa máquina de
# verdade. Não publica nada, não cria release, não escreve manifesto e não usa
# segredo: os pacotes saem SEM assinatura de updater (`createUpdaterArtifacts`
# desligado) e só ficam como artefato do run (14 dias).
#
# Roda a cada push na branch `linux` e sob demanda (Actions › Linux build ›
# Run workflow). A release de verdade é o job `linux` do release-v4.yml, que
# fica desligado até o Linux ser testado.
name: Linux build

on:
  push:
    branches:
      - linux
  workflow_dispatch:

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundles:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libssl-dev libxdo-dev pkg-config build-essential patchelf file xdg-utils

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: "linux-release"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Linux standard edition
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          VITE_ENABLE_NEXUS: "false"
          VITE_ENABLE_WEBSERVER: "false"
          VITE_ENABLE_AVATAR_BATCH: "true"
          VITE_ENABLE_PYTHON_SCRIPTS: "true"
        run: bun tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --no-default-features --features standard

      - name: Stage Linux standard installers
        run: |
          node .github/scripts/linux-release-assets.mjs stage --edition standard --version "test-${{ github.run_number }}" --bundle src-tauri/target/release/bundle --out out/standard --no-sign
          rm -rf src-tauri/target/release/bundle

      - name: Build Linux full edition (every feature)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          VITE_ENABLE_NEXUS: "true"
          VITE_ENABLE_WEBSERVER: "true"
          VITE_ENABLE_AVATAR_BATCH: "true"
          VITE_ENABLE_PYTHON_SCRIPTS: "true"
        run: bun tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --features full

      - name: Stage Linux full installers
        run: node .github/scripts/linux-release-assets.mjs stage --edition full --version "test-${{ github.run_number }}" --bundle src-tauri/target/release/bundle --out out/full --no-sign

      - name: Upload standard installers
        uses: actions/upload-artifact@v4
        with:
          name: multialt-linux-standard
          path: out/standard/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload full installers
        uses: actions/upload-artifact@v4
        with:
          name: multialt-linux-full
          path: out/full/*
          if-no-files-found: error
          retention-days: 14
