name: Release v4

# Todo push em `main` publica: calcula a versao, compila as duas variantes,
# cria a release e escreve o `latest.json` que o app le para se atualizar.
# Para pular, use a marca de pular que a condicao `if` do job mais abaixo
# procura.
#
# Cuidado com essa marca: o `contains` olha a mensagem **inteira**, corpo
# incluso. Citar a marca dentro de um texto explicativo pula a publicacao do
# mesmo jeito — aconteceu no primeiro teste deste pipeline, e o job apareceu
# como "skipped" sem motivo aparente.
#
# Mudanca so de `.md` nao dispara nada (o `paths-ignore` abaixo) — teste de
# pipeline precisa tocar em arquivo de codigo, senao parece que o gatilho
# quebrou quando na verdade ele foi ignorado de proposito.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "**/*.MD"
      # O site de divulgação sai pelo site.yml, sem release.
      - "site/**"
      - ".github/workflows/site.yml"
      # Formulários de bug/sugestão (o botão "Send feedback" do app abre).
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:
    inputs:
      # auto: o tipo da release decide (fix -> patch; feature/mixed -> minor).
      bump:
        description: "Version bump type (auto = decided by the release kind)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor

concurrency:
  group: release-v4
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      # ── Anexos da release ────────────────────────────────────────────────
      # O instalador e o **MSI**, nas duas variantes — o unico desde 03/10/2026.
      # O setup NSIS (.exe) saiu: levava marcacao heuristica no VirusTotal (3/71
      # no 4.0.5, 1/75 nas 0.1.x) enquanto o MSI sai 0/75. Quem instalou pelo
      # NSIS deixa de receber atualizacao (decisao do dono); o README orienta a
      # instalar o MSI uma vez. O manifesto do updater so tem a chave
      # `windows-x86_64-msi` (.github/scripts/update-manifest-platforms.mjs).
      #
      # O MSI padrao sai com um nome fixo, `MultiAlt-Setup.msi` (a copia com a
      # versao no nome e apagada: e o mesmo arquivo), e e para ele que o botao
      # de download do README e o updater apontam, por
      # `/releases/latest/download/` — e por isso a release **nao** e marcada
      # como pre-lancamento (o GitHub ignora pre-lancamento no "latest").
      #
      # ── Interruptor do portatil ──────────────────────────────────────────
      # Portatil: o executavel solto, sem instalar (`MultiAlt_<v>_x64_portable.exe`
      # e `..._portable_full-nexus-ws.exe`). Sem admin, mas nao passa pelo
      # updater. DESLIGADO desde 03/10/2026 (decisao do dono): o `.exe` solto
      # leva 1/75 de um motor de ML no VirusTotal (Wacatac, da Microsoft, na
      # v0.1.3) enquanto o MSI sai 0/75 — a release publica so os MSI e os
      # arquivos do updater.
      #
      # Para VOLTAR a publicar o portatil, troque "false" por "true" aqui e
      # nada mais: todo passo do portatil (copia, renomeio, upload e a linha
      # do guia "Which file to download") ja checa este valor, e o site mostra
      # a linha "Portable" sozinho quando o arquivo existe na release.
      # O .github/scripts/release-workflow.test.mjs trava o padrao em "false" —
      # mude o teste junto.
      PUBLISH_PORTABLE: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Cache das dependencias compiladas do Rust. O runner nasce limpo, entao
      # sem isto cada release recompila a arvore inteira DUAS vezes (a variante
      # padrao e a completa) — e ai vao 90% do tempo do workflow.
      #
      # A acao guarda so as dependencias, nunca o crate do projeto, senao um
      # build velho poderia ser reaproveitado indevidamente. `workspaces` aponta
      # para `src-tauri`, que e onde mora o Cargo.toml.
      #
      # A primeira execucao depois deste commit continua lenta: nao ha o que
      # reaproveitar ainda. E o cache do GitHub tem teto de 10 GB por
      # repositorio, com despejo do mais antigo — se ficar muito tempo sem
      # publicar, o proximo release volta a ser lento.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Validate required v4 files
        shell: pwsh
        run: |
          $required = @(
            "package.json",
            "src-tauri/tauri.conf.json",
            "src-tauri/Cargo.toml"
          )

          $missing = @()
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              $missing += $path
            }
          }

          if ($missing.Count -gt 0) {
            throw "Missing required v4 files on this branch: $($missing -join ', '). Commit/push the v4 rewrite files first, then rerun Release v4."
          }

      # Tipo da release (fix / feature / mixed) e o bump que ele decide: fix
      # soma patch, feature e mixed somam minor. A regra mora em
      # .github/scripts/release-kind.mjs (testada na suite `release`); aqui so
      # se junta o que ela le — a mensagem do commit, os rotulos e o texto do
      # PR que trouxe o commit para a `main` (secao "## What's new").
      - name: Resolve bump and channel
        id: controls
        uses: actions/github-script@v7
        with:
          script: |
            const path = require("node:path");
            const { pathToFileURL } = require("node:url");
            const { resolveReleaseControls } = await import(
              pathToFileURL(path.join(process.env.GITHUB_WORKSPACE, ".github", "scripts", "release-kind.mjs")).href
            );

            const message = context.payload.head_commit?.message || "";
            const dispatchBump = context.payload.inputs?.bump || "";

            let pr = null;
            try {
              const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha
              });
              pr = prs.data.find((item) => item.merged_at) ?? prs.data[0] ?? null;
            } catch (error) {
              core.warning(`Could not read the release PR: ${error.message}`);
            }

            const labels = (pr?.labels || []).map((label) => String(label.name));
            const { kind, bump, channel } = resolveReleaseControls({
              message,
              labels,
              prBody: pr?.body || "",
              dispatchBump
            });

            if (pr) core.setOutput("pr_number", String(pr.number));
            core.info(`Release kind: ${kind}, bump: ${bump}, channel: ${channel}`);
            core.setOutput("kind", kind);
            core.setOutput("bump", bump);
            core.setOutput("channel", channel);

      - name: Prepare version and release metadata
        id: meta
        run: bun .github/scripts/prepare-release.mjs
        env:
          RELEASE_BUMP: ${{ steps.controls.outputs.bump }}
          RELEASE_CHANNEL: ${{ steps.controls.outputs.channel }}
          RELEASE_KIND: ${{ steps.controls.outputs.kind }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Configure bundle targets
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $targets = @("msi")
          $config.bundle.targets = $targets
          $config | ConvertTo-Json -Depth 100 | Set-Content src-tauri/tauri.conf.json
          Write-Host "Bundle targets: $($targets -join ', ')"

      - name: Inject updater public key
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if (-not $config.plugins) { $config | Add-Member -Name "plugins" -Value ([PSCustomObject]@{}) -MemberType NoteProperty }
          if (-not $config.plugins.updater) { $config.plugins | Add-Member -Name "updater" -Value ([PSCustomObject]@{}) -MemberType NoteProperty }
          $config.plugins.updater | Add-Member -Name "pubkey" -Value "${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}" -MemberType NoteProperty -Force
          $config | ConvertTo-Json -Depth 100 | Set-Content src-tauri/tauri.conf.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and publish standard release
        id: tauri_build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ env.RELEASE_GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_ENABLE_NEXUS: "false"
          VITE_ENABLE_WEBSERVER: "false"
        with:
          projectPath: "."
          tauriScript: "bun tauri"
          args: -- --no-default-features
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: ${{ steps.meta.outputs.release_title }}
          releaseBody: ${{ steps.meta.outputs.release_body }}
          generateReleaseNotes: true
          # Nunca pre-lancamento: o botao do README usa /releases/latest/download,
          # e o GitHub nao considera pre-lancamento como "latest". O canal
          # (beta/stable) continua no titulo, no texto e no manifesto do updater.
          prerelease: false
          releaseDraft: false

      - name: Stage standard portable binary
        if: env.PUBLISH_PORTABLE == 'true'
        shell: pwsh
        run: |
          Copy-Item "src-tauri/target/release/roblox-account-manager.exe" "src-tauri/target/release/portable-standard.exe" -Force

      # A copia com nome fixo sai **antes** do build completo, que reescreve a
      # mesma pasta bundle/msi com o MSI da outra variante.
      - name: Stage stable-named MSI for the README button
        shell: pwsh
        run: |
          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi" -File -Filter "*.msi" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $msi) { throw "Standard MSI not found" }
          Copy-Item $msi.FullName "src-tauri/target/release/MultiAlt-Setup.msi" -Force

      - name: Wait for release to become available
        shell: pwsh
        env:
          GH_TOKEN: ${{ env.RELEASE_GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $repo = "${{ github.repository }}"

          for ($i = 1; $i -le 20; $i++) {
            gh release view $tag --repo $repo --json id *> $null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Release $tag is available in $repo"
              break
            }

            if ($i -eq 20) {
              throw "Release $tag not found in $repo after waiting"
            }

            Start-Sleep -Seconds 3
          }

      # Sobe antes do manifesto: o updater passa a baixar este arquivo
      # (toStableMsiUrl em update-manifest-platforms.mjs).
      - name: Upload stable-named MSI
        shell: pwsh
        env:
          GH_TOKEN: ${{ env.RELEASE_GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.meta.outputs.tag }}" "src-tauri/target/release/MultiAlt-Setup.msi" --repo "${{ github.repository }}" --clobber

      - name: Generate and push standard update manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ env.RELEASE_GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_CHANNEL: ${{ steps.controls.outputs.channel }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bun .github/scripts/generate-update-manifest.mjs

      - name: Configure updater endpoint for full feature channel
        shell: pwsh
        run: |
          $channel = "${{ steps.controls.outputs.channel }}"
          $repo = "${{ github.repository }}"
          $endpoint = "https://raw.githubusercontent.com/$repo/update-manifests/$channel-nexus-ws/latest.json"
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if (-not $config.plugins) { $config | Add-Member -Name "plugins" -Value ([PSCustomObject]@{}) -MemberType NoteProperty }
          if (-not $config.plugins.updater) { $config.plugins | Add-Member -Name "updater" -Value ([PSCustomObject]@{}) -MemberType NoteProperty }
          $config.plugins.updater.endpoints = @($endpoint)
          $config | ConvertTo-Json -Depth 100 | Set-Content src-tauri/tauri.conf.json

      - name: Build full feature variant (Nexus + WebServer)
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_ENABLE_NEXUS: "true"
          VITE_ENABLE_WEBSERVER: "true"
        run: |
          bun tauri build -- --features nexus,webserver

      - name: Prepare full feature assets and manifest
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_VERSION: ${{ steps.meta.outputs.app_version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $bundleRoot = "src-tauri/target/release/bundle"
          $stageDir = "src-tauri/target/release/release-assets"
          $standardPortableSrc = "src-tauri/target/release/portable-standard.exe"
          $fullPortableSrc = "src-tauri/target/release/roblox-account-manager.exe"
          $msiDir = Join-Path $bundleRoot "msi"

          if (Test-Path $stageDir) {
            Remove-Item $stageDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $stageDir | Out-Null

          if ($env:PUBLISH_PORTABLE -eq "true") {
            if (-not (Test-Path $standardPortableSrc)) {
              throw "Standard portable binary not found"
            }

            if (-not (Test-Path $fullPortableSrc)) {
              throw "Full feature portable binary not found"
            }
          }

          $fullMsiSrc = $null
          if (Test-Path $msiDir) {
            $fullMsiSrc = Get-ChildItem $msiDir -File -Recurse -Filter "*.msi" |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
          }

          if (-not $fullMsiSrc) {
            throw "Full feature MSI not found"
          }

          $fullMsiSigSrc = "$($fullMsiSrc.FullName).sig"
          if (-not (Test-Path $fullMsiSigSrc)) {
            throw "Full feature MSI signature not found"
          }

          $v = $env:RELEASE_VERSION
          $fullMsiName = "MultiAlt_${v}_x64_en-US_full-nexus-ws.msi"
          $standardPortableName = "MultiAlt_${v}_x64_portable.exe"
          $fullPortableName = "MultiAlt_${v}_x64_portable_full-nexus-ws.exe"

          Copy-Item $fullMsiSrc.FullName (Join-Path $stageDir $fullMsiName) -Force
          Copy-Item $fullMsiSigSrc (Join-Path $stageDir "$fullMsiName.sig") -Force

          if ($env:PUBLISH_PORTABLE -eq "true") {
            Copy-Item $standardPortableSrc (Join-Path $stageDir $standardPortableName) -Force
            Copy-Item $fullPortableSrc (Join-Path $stageDir $fullPortableName) -Force
          }

          $baseUrl = "https://github.com/$($env:GITHUB_REPOSITORY)/releases/download/$($env:RELEASE_TAG)"
          $fullMsiSignature = (Get-Content $fullMsiSigSrc -Raw).Trim()

          # So a chave do MSI (ver update-manifest-platforms.mjs, que o
          # generate-update-manifest.mjs aplica de novo): sem a generica, um app
          # de formato desconhecido nunca recebe o MSI como "atualizacao".
          $platforms = [ordered]@{}
          $platforms["windows-x86_64-msi"] = [ordered]@{
            signature = $fullMsiSignature
            url = "$baseUrl/$fullMsiName"
          }

          $manifest = [ordered]@{
            version = $v
            notes = ""
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = $platforms
          }

          $fullManifestOut = Join-Path $stageDir "latest-full.json"
          $manifest | ConvertTo-Json -Depth 100 | Set-Content $fullManifestOut

          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_STAGE_DIR=$stageDir"
          Add-Content -Path $env:GITHUB_ENV -Value "FULL_MSI_NAME=$fullMsiName"
          Add-Content -Path $env:GITHUB_ENV -Value "STANDARD_PORTABLE_NAME=$standardPortableName"
          Add-Content -Path $env:GITHUB_ENV -Value "FULL_PORTABLE_NAME=$fullPortableName"
          Add-Content -Path $env:GITHUB_ENV -Value "FULL_MANIFEST_PATH=$fullManifestOut"

      - name: Upload full feature installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ env.RELEASE_GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $repo = "${{ github.repository }}"
          $fullMsiPath = Join-Path $env:RELEASE_STAGE_DIR $env:FULL_MSI_NAME
          gh release upload $tag "$fullMsiPath" --repo $repo --clobber

      - name: Upload portable binaries
        if: env.PUBLISH_PORTABLE == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ env.RELEASE_GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $repo = "${{ github.repository }}"
          $standardPortablePath = Join-Path $env:RELEASE_STAGE_DIR $env:STANDARD_PORTABLE_NAME
          $fullPortablePath = Join-Path $env:RELEASE_STAGE_DIR $env:FULL_PORTABLE_NAME
          gh release upload $tag "$standardPortablePath" --repo $repo --clobber
          gh release upload $tag "$fullPortablePath" --repo $repo --clobber

      - name: Generate and push full feature update manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ env.RELEASE_GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_CHANNEL: ${{ format('{0}-nexus-ws', steps.controls.outputs.channel) }}
          RELEASE_MANIFEST_PATH: ${{ env.FULL_MANIFEST_PATH }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bun .github/scripts/generate-update-manifest.mjs

      - name: Upload signature assets at bottom
        shell: pwsh
        env:
          GH_TOKEN: ${{ env.RELEASE_GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $repo = "${{ github.repository }}"
          $tmpDir = "src-tauri/target/release/reordered-signatures"

          if (Test-Path $tmpDir) {
            Remove-Item $tmpDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $tmpDir | Out-Null

          $release = gh release view $tag --repo $repo --json assets | ConvertFrom-Json
          $sigNames = @($release.assets | Where-Object { $_.name -like "*.sig" } | ForEach-Object { $_.name })

          foreach ($name in $sigNames) {
            gh release download $tag --repo $repo --pattern "$name" --dir "$tmpDir" --clobber
            gh release delete-asset $tag "$name" --repo $repo --yes
          }

          $fullMsiSig = Join-Path $env:RELEASE_STAGE_DIR "$env:FULL_MSI_NAME.sig"

          if (Test-Path $fullMsiSig) {
            Copy-Item $fullMsiSig (Join-Path $tmpDir (Split-Path $fullMsiSig -Leaf)) -Force
          }

          Get-ChildItem $tmpDir -File -Filter "*.sig" | ForEach-Object {
            $baseName = $_.Name
            while ($baseName.StartsWith("zz-")) {
              $baseName = $baseName.Substring(3)
            }
            $uploadPath = Join-Path $tmpDir "zz-$baseName"
            if ($_.FullName -ne $uploadPath) {
              Copy-Item $_.FullName $uploadPath -Force
            }
          }

          Get-ChildItem $tmpDir -File -Filter "zz-*.sig" | Sort-Object Name | ForEach-Object {
            gh release upload $tag $_.FullName --repo $repo --clobber
          }

      - name: Clean up release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ env.RELEASE_GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $repo = "${{ github.repository }}"
          gh release delete-asset $tag "latest.json" --repo $repo --yes 2>$null
          # Um setup só: a cópia com versão (MultiAlt_*_x64_en-US.msi) é o mesmo
          # arquivo do MultiAlt-Setup.msi. A assinatura dela fica (zz-*.sig).
          $assets = gh release view $tag --repo $repo --json assets --jq '.assets[].name'
          $assets | Where-Object { $_ -like "MultiAlt_*_x64_en-US.msi" } | ForEach-Object {
            gh release delete-asset $tag $_ --repo $repo --yes 2>$null
          }
          gh release delete-asset $tag "roblox-account-manager.exe" --repo $repo --yes 2>$null
          gh release delete-asset $tag "Roblox.Account.Manager.Recommended.Portable.exe" --repo $repo --yes 2>$null
          gh release delete-asset $tag "Roblox Account Manager (Recommended) Portable.exe" --repo $repo --yes 2>$null
          gh release delete-asset $tag "Roblox Account Manager (Full Features) Portable.exe" --repo $repo --yes 2>$null
          gh release delete-asset $tag "zz-Roblox.Account.Manager.Optional.Full.Features.-.Nexus.+.WebServer.zip" --repo $repo --yes 2>$null
          gh release delete-asset $tag "zz-Roblox Account Manager (Optional Full Features - Nexus + WebServer).zip" --repo $repo --yes 2>$null
          exit 0

      - name: Finalize release notes
        uses: actions/github-script@v7
        with:
          github-token: ${{ env.RELEASE_GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.RELEASE_TAG;
            const channel = String(process.env.RELEASE_CHANNEL || "beta").toLowerCase();
            const previousTag = process.env.RELEASE_PREVIOUS_TAG;

            const generatedNotes = await github.rest.repos.generateReleaseNotes({
              owner,
              repo,
              tag_name: tag,
              target_commitish: context.sha,
              ...(previousTag ? { previous_tag_name: previousTag } : {})
            });
            const generatedBody = String(generatedNotes.data.body || "").trim();

            // "What's Changed" em linguagem simples (pedido do dono, 03/10/2026):
            // vem da secao "## What's new" do PR que gerou a release. A lista
            // automatica do GitHub (titulos de PR, tecnica) fica recolhida em
            // "Technical details". PR sem a secao: fica so a lista automatica.
            let plainChanges = "";
            try {
              const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: context.sha
              });
              const pr = prs.data.find((item) => item.merged_at) || prs.data[0];
              const lines = String(pr?.body || "").split(/\r?\n/);
              const start = lines.findIndex((line) => /^##\s+What's new\s*$/i.test(line));
              if (start >= 0) {
                const end = lines.findIndex((line, i) => i > start && /^##\s+\S/.test(line));
                plainChanges = lines.slice(start + 1, end < 0 ? undefined : end).join("\n").trim();
              }
            } catch (error) {
              core.warning(`Could not read the "What's new" section of the release PR: ${error.message}`);
            }
            const technicalList = generatedBody.replace(/^##\s+What's Changed\s*/i, "").trim();
            const changesBlock = plainChanges
              ? [
                  "## What's Changed",
                  plainChanges,
                  ...(technicalList
                    ? ["", "<details>", "<summary>Technical details</summary>", "", technicalList, "", "</details>"]
                    : [])
                ].join("\n")
              : generatedBody || "## What's Changed\n- Release notes could not be generated.";

            const contributorSet = new Set();
            // O dono do repositorio aparece sempre: sem tag anterior (a 1.0.0 abriu
            // a serie 1.x) a comparacao nao roda e o bloco saia vazio.
            contributorSet.add(owner);
            if (previousTag) {
              try {
                const compare = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${previousTag}...${tag}`
                });
                for (const commit of compare.data.commits || []) {
                  const login = commit.author?.login;
                  if (login) {
                    contributorSet.add(login);
                  }
                }
              } catch (error) {
                core.warning(`Could not compute contributor range ${previousTag}...${tag}: ${error.message}`);
              }
            }

            const contributors = Array.from(contributorSet);
            let contributorsBlock = "## Contributors\n- No contributor metadata found for this release range.";
            if (contributors.length > 0) {
              const avatars = contributors
                .map((login) => `<a href=\"https://github.com/${login}\"><img src=\"https://github.com/${login}.png?size=64\" width=\"32\" height=\"32\" alt=\"@${login}\" /></a>`)
                .join(" ");
              const names = contributors
                .map((login) => `[@${login}](https://github.com/${login})`)
                .join(", ");
              contributorsBlock = `## Contributors\n${avatars}\n\n${names}`;
            }

            // Texto pensado para quem nao e tecnico (pedido do dono, 03/10/2026):
            // primeiro o botao do instalador e tres frases curtas; o resto fica
            // num bloco recolhido. Sem commit, canal ou versao antiga no topo.
            // Os titulos "## What's Changed" e "## Contributors" ficam: o
            // UpdateDialog do app procura os dois.
            const msiUrl = `https://github.com/${owner}/${repo}/releases/download/${tag}/MultiAlt-Setup.msi`;
            const publishPortable = process.env.PUBLISH_PORTABLE === "true";
            const otherFiles = [
              "<details>",
              "<summary>Other files (you can ignore these)</summary>",
              "",
              "- Files with `full-nexus-ws` in the name: only for people who use external scripts (Nexus or the local API).",
              "- `.sig` files: used by the automatic update."
            ];
            if (publishPortable) {
              otherFiles.push("- `..._x64_portable.exe`: runs without installing, but does not update itself.");
            }
            otherFiles.push("", "</details>");

            const betaLine = channel === "beta"
              ? ["", "> [!NOTE]", "> This is a beta version: some things may still change."]
              : [];

            const topNote = [
              "## Download",
              "",
              `### [⬇ Download MultiAlt-Setup.msi](${msiUrl})`,
              "",
              "Open the file and follow the installer. That's it.",
              "",
              "- Windows 10 or 11",
              "- No administrator password needed",
              "- Updates itself when a new version comes out",
              ...betaLine,
              "",
              ...otherFiles
            ].join("\n");

            // Primeira linha: a marca do tipo da release (o app a le — ver
            // src/releaseNotes.ts) e o selo visivel ("🩹 Hotfix", "✨ New
            // features" ou "📦 General update"), acima do download.
            const path = require("node:path");
            const { pathToFileURL } = require("node:url");
            const { releaseKindHeader } = await import(
              pathToFileURL(path.join(process.env.GITHUB_WORKSPACE, ".github", "scripts", "release-kind.mjs")).href
            );
            const kindHeader = releaseKindHeader(String(process.env.RELEASE_KIND || "mixed").toLowerCase());

            const finalBody = [
              kindHeader,
              "",
              topNote,
              "",
              changesBlock,
              "",
              contributorsBlock
            ].join("\n");

            const release = await github.rest.repos.getReleaseByTag({
              owner,
              repo,
              tag
            });

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.data.id,
              body: finalBody
            });
        env:
          RELEASE_CHANNEL: ${{ steps.controls.outputs.channel }}
          RELEASE_KIND: ${{ steps.controls.outputs.kind }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_APP_VERSION: ${{ steps.meta.outputs.app_version }}
          RELEASE_PREVIOUS_TAG: ${{ steps.meta.outputs.previous_tag }}
