# Só na branch `linux` (31/10/2026): mede o quanto o backend está de compilar
# no Linux. Não roda testes nem publica nada. Os erros do cargo vão para uma
# anotação do job, que a API pública do GitHub devolve sem token (o log não).
name: Linux check

on:
  push:
    branches:
      - linux
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libssl-dev pkg-config build-essential

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: "linux"

      - name: Check Rust backend (standard and full)
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo check --manifest-path src-tauri/Cargo.toml --locked --no-default-features --features standard --message-format=short 2> standard.txt
          s=$?
          cargo check --manifest-path src-tauri/Cargo.toml --locked --all-features --message-format=short 2> full.txt
          f=$?
          echo "$s" > standard.code; echo "$f" > full.code
          for edition in standard full; do
            code=$(cat $edition.code)
            n=$(grep -cE ': error|^error' $edition.txt)
            # Resumo: total, erros por arquivo e os primeiros erros (a anotação tem limite de tamanho).
            errors=$( { echo "total: $n"; grep -E ': error' $edition.txt | cut -d: -f1 | sort | uniq -c | sort -rn | head -40; echo; grep -E ': error|^error' $edition.txt | sort -u | head -25; } )
            [ "$n" -eq 0 ] && errors=$(tail -40 $edition.txt)
            body=$(printf '%s' "$errors" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            if [ "$code" -eq 0 ]; then echo "::notice title=$edition::compiles"; else echo "::error title=$edition (exit $code, $n errors)::$body"; fi
          done
          [ $s -eq 0 ] && [ $f -eq 0 ]
